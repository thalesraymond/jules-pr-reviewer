name: "Advanced Jules PR Reviewer"
description: "Review pull requests with Google Jules and post the review as a PR comment. Optionally gate merges based on review verdict."
author: "thalesraymond"

branding:
  icon: "check-circle"
  color: "purple"

inputs:
  jules_api_key:
    description: "Jules API key (create one at jules.google.com)."
    required: true
  github_token:
    description: "GitHub token with pull-requests:write and checks:write. Usually the default GITHUB_TOKEN secret."
    required: true
  fail_on:
    description: "When to fail the check run: never | blocking | any. Default blocking."
    required: false
    default: "blocking"
  min_severity_to_report:
    description: "Minimum severity of findings to post, annotate, and count: info (all, default) | warning | high. Findings below this level are not reported."
    required: false
    default: "info"
  block_on:
    description: "Fail the check run when a reported finding is at or above this severity: high | warning | info. When set, overrides fail_on (which maps the LLM verdict); when unset, fail_on is used unchanged."
    required: false
    default: ""
  skip_drafts:
    description: "Skip review on draft PRs."
    required: false
    default: "true"
  skip_forks:
    description: "Skip review on PRs from forks (prompt-injection risk)."
    required: false
    default: "true"
  bypass_label:
    description: "Label that, when applied to a PR, skips the review entirely."
    required: false
    default: "jules-override"
  ignore_title_keywords:
    description: "JSON array or comma/newline-separated list of case-insensitive title substrings. If the PR title contains any of them, the review is skipped entirely."
    required: false
    default: ""
  ignore_authors:
    description: "JSON array or comma/newline-separated list of GitHub usernames. PRs authored by these users are skipped entirely."
    required: false
    default: ""
  review_labels:
    description: "Allow/deny label filter. Plain entries are allow labels (the PR must have at least one); entries prefixed with '-' are deny labels (the PR must have none). Only enforced when the event payload includes PR labels; otherwise a warning is logged and the review proceeds."
    required: false
    default: ""
  status_context:
    description: "Check run name."
    required: false
    default: "jules/review"
  extra_instructions:
    description: "Free-form Markdown appended to the review prompt. Use to add project-specific rules, frameworks, or focus areas directly from the workflow."
    required: false
    default: ""
  rules_file:
    description: "Path (in the repo) to a Markdown file whose contents are injected into the prompt. Default .github/jules-review-rules.md if it exists. Set to empty string to disable."
    required: false
    default: ".github/jules-review-rules.md"
  rules_directory:
    description: "Directory (in the repo, at the base SHA) with per-path review rules. Every .md file is a rule; its path relative to this directory is a glob applied to the PR's changed files (e.g. src/**.md applies to src/**). Only rules matching at least one changed file are injected into the prompt. Default .github/jules-rules if it exists. Set to empty string to disable."
    required: false
    default: ".github/jules-rules"
  ignored_paths:
    description: "JSON array or list of file paths/globs to ignore when reviewing diffs (e.g. '[\"dist/**\", \"*.lock\"]')."
    required: false
    default: "[]"
  timeout_minutes:
    description: "How long to wait for Jules to return a review before giving up. Default 30. Real reviews on non-trivial PRs often take 15-25 minutes; do not set below 20 or you will miss legitimate reviews."
    required: false
    default: "30"
  enable_suggestions:
    description: "Enable GitHub-native one-click suggested changes in review comments. Default false."
    required: false
    default: "false"
  dedupe:
    description: "Avoid re-reporting previously posted, still-open findings on subsequent reviews. Set to false to let Jules re-review and re-report prior findings."
    required: false
    default: "true"
  diff_mode:
    description: "Review pipeline: prompt (embed diff in prompt, default) or agentic (Jules inspects PR branch directly)."
    required: false
    default: "prompt"
  large_pr_threshold:
    description: "Diff size (characters) above which the large-PR strategy kicks in. Default 80000."
    required: false
    default: "80000"
  large_pr_strategy:
    description: "How to handle diffs over large_pr_threshold: prioritize (review the highest-churn files that fit in the prompt budget and report which files were not covered) or truncate (keep the first N characters, legacy behaviour). Default prioritize."
    required: false
    default: "prioritize"

outputs:
  verdict:
    description: "Review verdict (approve, comment, block, or skipped)."
  issues_count:
    description: "Total count of review issues found."
  high_issues_count:
    description: "Count of high-severity issues."
  warning_issues_count:
    description: "Count of warning-level issues."
  info_issues_count:
    description: "Count of info-level issues."
  session_id:
    description: "Jules review session ID for reference and debugging."

runs:
  using: "node24"
  main: "dist/index.js"
