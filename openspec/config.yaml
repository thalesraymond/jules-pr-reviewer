schema: spec-driven

context: |
  Project: GitHub Action (`jules-pr-reviewer`) using `@google/jules-sdk` to automatically review pull requests and post review comments on `pull_request` events.
  Tech Stack:
  - Runtime: Node 24 (GitHub Actions runner), ESNext ESM module system ("type": "module")
  - Language: TypeScript 6 (`strict: true`, ES2022 target, ESNext modules)
  - Package Manager: pnpm
  - Bundler: `@vercel/ncc` (compiles `src/index.ts` to single-file output `dist/index.js`)
  - Testing: Vitest 4 with `@vitest/coverage-v8` (90% coverage threshold required across lines, functions, branches, statements)
  - Linting & Formatting: ESLint 10 + `typescript-eslint` + `eslint-config-prettier`, Prettier 3
  - Git Hooks: Husky 9 (`pre-commit` runs lint -> format:check -> build -> coverage) + commitlint (Conventional Commits)

  Standards & Guidelines:
  - Test-Driven Development (TDD): Always write tests first, then write the minimum code necessary to pass tests.
  - Strict Type Safety: Avoid using `any`, `as any`, or `as unknown` to bypass TypeScript type safety.
  - Code Style & Formatting: Double quotes, semicolons, ES5 trailing commas, 80-character print width, 2-space indentation. Always use `.js` extensions for local relative imports (required by ESM + bundler).
  - Architecture & Security:
    - Follow SOLID principles for modular, maintainable design.
    - Prompt-injection defense: PR title, description, diff, rules file labeled `UNTRUSTED`.
    - Block `pull_request_target` event to avoid token-scope escalation.
  - Documentation Upkeep: Keep `README.md` updated when introducing new features or altering setup steps.
  - Verification Commands:
    - `pnpm lint` (ESLint - zero errors)
    - `pnpm format:check` (Prettier)
    - `pnpm build` (`@vercel/ncc` bundle)
    - `pnpm test` (Vitest unit tests)
    - `pnpm coverage` (Vitest coverage, >= 90%)

rules:
  proposal:
    - State key security considerations (e.g. untrusted inputs, token escalation)
    - Outline architecture, impacted files, and design choices following SOLID principles
  tasks:
    - Enforce TDD workflow (tests written before feature implementation)
    - Include verification steps (`pnpm lint`, `pnpm format:check`, `pnpm build`, `pnpm coverage`)
    - Include `dist/index.js` bundling check when `src/` files are modified

